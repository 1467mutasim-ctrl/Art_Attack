{% extends "base.html" %}{% block title %}Create character — Art Attack{% endblock %}{% block content %}
<section class="panel form-card"><span class="eyebrow">Character workshop</span><h1 class="display">Publish a character</h1><p class="muted">Give other artists enough visual and story detail to create an attack.</p><form method="post" enctype="multipart/form-data" class="form-grid"><div class="field"><label>Name</label><input name="name" maxlength="100" required></div><div class="field"><label>Pronouns</label><input name="pronouns" maxlength="50" placeholder="she/her, they/them…"></div><div class="field full"><label>Description</label><textarea name="description" maxlength="5000" placeholder="Personality, story, visual details, and drawing notes…"></textarea></div><div class="field full"><label>Reference image</label><input name="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp"></div><div class="full action-row"><a class="btn" href="{{ url_for('characters') }}">Cancel</a><button class="btn btn-primary" type="submit">Publish character</button></div></form></section>{% endblock %}
