{% extends "base.html" %}{% block title %}Edit {{ character.name }} — Art Attack{% endblock %}{% block content %}
<section class="panel form-card"><span class="eyebrow">Character workshop</span><h1 class="display">Edit {{ character.name }}</h1><form method="post" enctype="multipart/form-data" class="form-grid"><div class="field"><label>Name</label><input name="name" value="{{ character.name }}" required></div><div class="field"><label>Pronouns</label><input name="pronouns" value="{{ character.pronouns or '' }}"></div><div class="field full"><label>Description</label><textarea name="description">{{ character.description or '' }}</textarea></div><div class="field full"><label>Replace reference image</label><input name="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp"></div><div class="full action-row"><a class="btn" href="{{ url_for('character_detail', character_id=character.id) }}">Cancel</a><button class="btn btn-primary" type="submit">Save character</button></div></form></section>{% endblock %}
